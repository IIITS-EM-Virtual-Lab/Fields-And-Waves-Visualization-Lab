<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="antGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  
  <!-- Antenna Mast -->
  <line x1="50" y1="82" x2="50" y2="40" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="38" y1="82" x2="62" y2="82" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="42" y1="62" x2="58" y2="62" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Antenna Tip / Feed point -->
  <circle cx="50" cy="38" r="5" fill="url(#antGrad)" />
  
  <!-- Radiating EM Waves -->
  <!-- Left Waves -->
  <path d="M 40 32 A 12 12 0 0 0 40 44" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 33 24 A 22 22 0 0 0 33 52" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 1" opacity="0.85" />
  <path d="M 26 16 A 32 32 0 0 0 26 60" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Right Waves -->
  <path d="M 60 32 A 12 12 0 0 1 60 44" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 67 24 A 22 22 0 0 1 67 52" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 1" opacity="0.85" />
  <path d="M 74 16 A 32 32 0 0 1 74 60" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
